<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Merge 2048 Number Puzzle</title>
<style>
  :root{
    --aqua:#0BE0D0; --navy:#10233F; --pink:#FF4D7D; --yellow:#FFC531;
    --purple:#7C5CFF; --lime:#B8F135; --blue:#00A8FF; --orange:#FF8A00;
    --bg0:#0b1830; --bg1:#152a4d; --board:#0d203c; --cell:rgba(255,255,255,.05);
    --ink:#eaf2ff; --ink-dim:#9fb2d0;
    --font:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); color:var(--ink); overflow:hidden;
    background:radial-gradient(120% 120% at 15% 0%,var(--bg1),var(--bg0) 60%);
    display:flex; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .wrap{
    width:100%; height:100%; max-width:560px; margin:0 auto;
    display:flex; flex-direction:column; padding:14px clamp(10px,3vw,20px);
    gap:12px;
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; flex-direction:column; line-height:1;}
  .brand h1{font-size:clamp(20px,5.5vw,30px); font-weight:1000; letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--aqua),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand span{font-size:11px; color:var(--ink-dim); font-weight:700; margin-top:3px; letter-spacing:.3px;}
  .scores{display:flex; gap:8px;}
  .score{
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08);
    border-radius:14px; padding:7px 13px; min-width:74px; text-align:center;
  }
  .score b{display:block; font-size:10px; color:var(--ink-dim); font-weight:800; letter-spacing:1px;}
  .score s{display:block; font-size:clamp(16px,4.5vw,22px); font-weight:1000; text-decoration:none;}
  .toolbar{display:flex; gap:8px; align-items:center;}
  button.btn{
    font-family:var(--font); font-weight:900; color:var(--navy); cursor:pointer;
    border:none; border-radius:13px; padding:10px 16px; font-size:14px;
    background:linear-gradient(180deg,var(--aqua),#08b6ab); box-shadow:0 5px 0 #067a72;
    transition:transform .08s, box-shadow .08s;
  }
  button.btn:active{transform:translateY(3px); box-shadow:0 2px 0 #067a72;}
  button.ghost{
    background:rgba(255,255,255,.07); color:var(--ink); box-shadow:none;
    border:1px solid rgba(255,255,255,.1); width:44px; height:44px; padding:0;
    display:grid; place-items:center; border-radius:13px;
  }
  button.ghost:active{transform:scale(.94);}
  button.ghost svg{width:20px; height:20px;}
  .stage{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; position:relative;}
  .boardwrap{position:relative; width:min(100%,440px); aspect-ratio:1/1;}
  .board{
    position:absolute; inset:0; background:var(--board);
    border:1px solid rgba(255,255,255,.06); border-radius:18px;
    padding:var(--gap); box-shadow:0 20px 50px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .grid-bg{position:absolute; inset:var(--gap); display:grid; gap:var(--gap);}
  .grid-bg .bgc{background:var(--cell); border-radius:12px;}
  .tiles{position:absolute; inset:var(--gap);}
  .tile{
    position:absolute; width:var(--cs); height:var(--cs);
    display:flex; align-items:center; justify-content:center;
    border-radius:12px; font-weight:1000; color:var(--navy);
    box-shadow:0 6px 14px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    will-change:transform; transition:left .12s cubic-bezier(.3,.9,.4,1), top .12s cubic-bezier(.3,.9,.4,1);
    overflow:hidden;
  }
  .tile.pop{animation:pop .18s ease;}
  .tile.new{animation:appear .18s ease;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes appear{0%{transform:scale(.1);opacity:.2}100%{transform:scale(1);opacity:1}}
  .overlay{
    position:absolute; inset:0; z-index:20; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:16px; padding:24px;
    background:radial-gradient(120% 120% at 50% 30%,rgba(16,35,63,.86),rgba(11,24,48,.96));
    border-radius:18px; backdrop-filter:blur(3px);
  }
  .overlay.show{display:flex; animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay h2{font-size:clamp(28px,8vw,44px); font-weight:1000; letter-spacing:-1px;}
  .overlay p{color:var(--ink-dim); font-size:15px; font-weight:700; max-width:280px;}
  .win h2{background:linear-gradient(90deg,var(--yellow),var(--orange)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .lose h2{background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hint{text-align:center; color:var(--ink-dim); font-size:12px; font-weight:700; letter-spacing:.3px; padding-bottom:2px;}
  .fx{position:absolute; inset:0; pointer-events:none; z-index:15; overflow:hidden;}
  .spark{position:absolute; width:9px; height:9px; border-radius:50%; will-change:transform,opacity;}
  @media (prefers-reduced-motion: reduce){
    .tile{transition:none !important;} .tile.pop,.tile.new,.overlay.show{animation:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>2048</h1><span>MERGE THE TILES</span></div>
    <div class="scores">
      <div class="score"><b>SCORE</b><s id="score">0</s></div>
      <div class="score"><b>BEST</b><s id="best">0</s></div>
    </div>
  </header>
  <div class="toolbar">
    <button class="btn" id="newBtn">New Game</button>
    <div style="flex:1"></div>
    <button class="ghost" id="undoBtn" title="Undo" aria-label="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.6-7.6L3 8"/></svg>
    </button>
    <button class="ghost" id="muteBtn" title="Sound" aria-label="Sound">
      <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
  <div class="stage">
    <div class="boardwrap">
      <div class="board" id="board">
        <div class="grid-bg" id="gridbg"></div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="fx" id="fx"></div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Game Over</h2>
        <p id="ovText"></p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn" id="ovBtn">Play Again</button>
          <button class="btn" id="keepBtn" style="display:none;background:linear-gradient(180deg,var(--yellow),#e0a911);box-shadow:0 5px 0 #a97f08">Keep Going</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">Swipe or use arrow keys to move</div>
</div>

<script>
(function(){
"use strict";
const SLUG="merge-2048-number-puzzle", SIZE=4, HI_KEY="gw_"+SLUG+"_hi";
const TILE_COLORS={
  2:"#eef2fb",4:"#e3ecff",8:"#FFC531",16:"#FF8A00",32:"#FF6b57",64:"#FF4D7D",
  128:"#B8F135",256:"#7CE86b",512:"#0BE0D0",1024:"#00A8FF",2048:"#7C5CFF",
  4096:"#a678ff",8192:"#ff7ab5"
};
const $=id=>document.getElementById(id);
const boardEl=$("board"), tilesEl=$("tiles"), gridbg=$("gridbg"), fxEl=$("fx");
const scoreEl=$("score"), bestEl=$("best"), overlay=$("overlay");
const ovTitle=$("ovTitle"), ovText=$("ovText"), ovBtn=$("ovBtn"), keepBtn=$("keepBtn"), hint=$("hint");
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let grid, score=0, best=0, won=false, dead=false, tileMap=new Map(), uid=1, history=[], busy=false;

// ---------- persistence ----------
try{ best=parseInt(localStorage.getItem(HI_KEY)||"0",10)||0; }catch(e){}
bestEl.textContent=best;

// ---------- audio ----------
let AC=null, muted=false;
try{ muted=localStorage.getItem("gw_"+SLUG+"_mute")==="1"; }catch(e){}
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function blip(freq,dur,type,vol){
  if(muted) return; const c=ac(); if(!c) return;
  try{
    if(c.state==="suspended") c.resume();
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    g.gain.value=0; o.connect(g); g.connect(c.destination);
    const t=c.currentTime; g.gain.linearRampToValueAtTime((vol||.12),t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.14));
    o.start(t); o.stop(t+(dur||.14)+.02);
  }catch(e){}
}
function mergeSound(v){ const n=Math.min(10,Math.log2(v)); blip(220+n*55,.16,"triangle",.14); }
function updateMuteUI(){ $("muteBtn").style.opacity=muted?".45":"1"; }
$("muteBtn").addEventListener("click",()=>{ muted=!muted; try{localStorage.setItem("gw_"+SLUG+"_mute",muted?"1":"0");}catch(e){} updateMuteUI(); if(!muted) blip(660,.1,"sine",.1); });
updateMuteUI();

// ---------- postMessage ----------
function post(msg){ try{ if(window.parent) window.parent.postMessage(msg,"*"); }catch(e){} }

// ---------- layout ----------
function relayout(){
  const w=boardEl.clientWidth;
  const gap=Math.max(7,Math.round(w*0.028));
  const cs=(w-gap*(SIZE+1))/SIZE;
  boardEl.style.setProperty("--gap",gap+"px");
  boardEl.style.setProperty("--cs",cs+"px");
  boardEl.style.setProperty("--gap",gap+"px");
  window._gap=gap; window._cs=cs;
  // reposition tiles
  tileMap.forEach(t=>positionTile(t));
}
function cellPos(r,c){
  const gap=window._gap, cs=window._cs;
  return { left:c*(cs+gap), top:r*(cs+gap) };
}
function fontFor(v){
  const len=String(v).length;
  const cs=window._cs;
  let f = len<=2?cs*0.46 : len===3?cs*0.36 : len===4?cs*0.29 : cs*0.24;
  return Math.max(11,f)+"px";
}

// ---------- grid model ----------
function emptyGrid(){ return Array.from({length:SIZE},()=>Array(SIZE).fill(null)); }
function buildBg(){
  gridbg.style.gridTemplateColumns="repeat("+SIZE+",1fr)";
  gridbg.style.gridTemplateRows="repeat("+SIZE+",1fr)";
  gridbg.innerHTML="";
  for(let i=0;i<SIZE*SIZE;i++){ const d=document.createElement("div"); d.className="bgc"; gridbg.appendChild(d); }
}
function createTile(r,c,v,isNew){
  const el=document.createElement("div"); el.className="tile"+(isNew?" new":"");
  const t={id:uid++, r,c, val:v, el};
  el.style.transition="none";
  styleTile(t); tilesEl.appendChild(el); tileMap.set(t.id,t); grid[r][c]=t; positionTile(t);
  requestAnimationFrame(()=>{ el.style.transition=""; });
  return t;
}
function styleTile(t){
  const el=t.el; el.textContent=t.val;
  el.style.background=TILE_COLORS[t.val]||"#c58bff";
  el.style.color = (t.val<=4)?"#334": "#10233F";
  el.style.fontSize=fontFor(t.val);
  if(t.val>=128) el.style.boxShadow="0 6px 18px rgba(0,0,0,.3), 0 0 22px "+(TILE_COLORS[t.val]||"#c58bff")+"55, inset 0 2px 0 rgba(255,255,255,.4)";
}
function positionTile(t){ const p=cellPos(t.r,t.c); t.el.style.left=p.left+"px"; t.el.style.top=p.top+"px"; }
function removeTile(t){ if(t.el&&t.el.parentNode) t.el.parentNode.removeChild(t.el); tileMap.delete(t.id); }

function emptyCells(){ const a=[]; for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++) if(!grid[r][c]) a.push([r,c]); return a; }
function spawn(){
  const cells=emptyCells(); if(!cells.length) return;
  const [r,c]=cells[(Math.random()*cells.length)|0];
  createTile(r,c,Math.random()<0.9?2:4,true);
}

// ---------- move logic ----------
function snapshot(){
  return { g: grid.map(row=>row.map(t=>t?t.val:0)), score };
}
function pushHistory(){
  history.push(snapshot()); if(history.length>8) history.shift();
}
function restoreFrom(snap){
  tileMap.forEach(removeTile); tileMap.clear(); grid=emptyGrid();
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){ if(snap.g[r][c]) createTile(r,c,snap.g[r][c],false); }
  score=snap.score; scoreEl.textContent=score;
  dead=false; overlay.classList.remove("show");
}

// direction vectors; we traverse in proper order
function move(dir){
  if(busy||dead) return;
  const before=snapshot();
  const order={ // traversal so tiles closer to target move first
    left:{dr:0,dc:-1}, right:{dr:0,dc:1}, up:{dr:-1,dc:0}, down:{dr:1,dc:0}
  }[dir];
  const rows=[...Array(SIZE).keys()], cols=[...Array(SIZE).keys()];
  if(dir==="right") cols.reverse();
  if(dir==="down") rows.reverse();

  let moved=false, gained=0, mergedTiles=[], maxVal=0;
  const merges=[]; // record merged pairs to animate

  for(const r of rows){
    for(const c of cols){
      const t=grid[r][c]; if(!t) continue;
      let nr=r, nc=c;
      // slide
      while(true){
        const tr=nr+order.dr, tc=nc+order.dc;
        if(tr<0||tr>=SIZE||tc<0||tc>=SIZE) break;
        const target=grid[tr][tc];
        if(!target){ nr=tr; nc=tc; continue; }
        if(target.val===t.val && !target._merged){
          // merge into target
          nr=tr; nc=tc;
          grid[r][c]=null;
          t.r=nr; t.c=nc; // will animate to target cell then be removed
          target._merged=true; target.val*=2;
          gained+=target.val; maxVal=Math.max(maxVal,target.val);
          merges.push({dying:t, survivor:target});
          moved=true;
          t._toRemove=true;
          break;
        }
        break;
      }
      if(!t._toRemove){
        if(nr!==r||nc!==c){ moved=true; grid[r][c]=null; grid[nr][nc]=t; t.r=nr; t.c=nc; }
      }
    }
  }

  if(!moved){ // clear merge flags
    tileMap.forEach(t=>{ t._merged=false; });
    return;
  }

  busy=true; pushHistoryPre(before);
  // animate positions
  tileMap.forEach(t=>{ if(!t._toRemove) positionTile(t); });
  merges.forEach(m=>{ positionTile(m.dying); });

  score+=gained;
  if(gained>0) mergeSound(maxVal);
  else blip(300,.06,"sine",.05);

  const finish=()=>{
    merges.forEach(m=>{
      removeTile(m.dying);
      styleTile(m.survivor);
      m.survivor.el.classList.remove("pop"); void m.survivor.el.offsetWidth; m.survivor.el.classList.add("pop");
      if(m.survivor.val>=128) burst(m.survivor);
    });
    tileMap.forEach(t=>{ t._merged=false; });
    scoreEl.textContent=score;
    if(score>best){ best=score; bestEl.textContent=best; try{localStorage.setItem(HI_KEY,String(best));}catch(e){} }
    post({type:"gw:score",score});
    spawn();
    busy=false;
    if(!won && maxVal>=2048){ won=true; showWin(); }
    else if(isDead()){ dead=true; showLose(); }
  };
  if(reduce){ finish(); }
  else setTimeout(finish,120);
}
function pushHistoryPre(snap){ history.push(snap); if(history.length>8) history.shift(); }

function isDead(){
  if(emptyCells().length) return false;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
    const v=grid[r][c].val;
    if(r+1<SIZE && grid[r+1][c] && grid[r+1][c].val===v) return false;
    if(c+1<SIZE && grid[r][c+1] && grid[r][c+1].val===v) return false;
  }
  return true;
}

// ---------- particles ----------
function burst(t){
  if(reduce) return;
  const rect=t.el.getBoundingClientRect(), fr=fxEl.getBoundingClientRect();
  const cx=rect.left-fr.left+rect.width/2, cy=rect.top-fr.top+rect.height/2;
  const col=TILE_COLORS[t.val]||"#c58bff";
  for(let i=0;i<10;i++){
    const s=document.createElement("div"); s.className="spark"; s.style.background=col;
    s.style.left=cx+"px"; s.style.top=cy+"px"; fxEl.appendChild(s);
    const ang=Math.random()*Math.PI*2, dist=26+Math.random()*40;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist;
    s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},
      {transform:`translate(${dx-4}px,${dy-4}px) scale(0)`,opacity:0}],
      {duration:420+Math.random()*200,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove();
  }
}

// ---------- overlays ----------
function showWin(){
  overlay.className="overlay show win"; ovTitle.textContent="You reached 2048!";
  ovText.textContent="Legendary. Keep going for an even higher score.";
  keepBtn.style.display=""; ovBtn.textContent="New Game";
  blip(880,.18,"triangle",.14); setTimeout(()=>blip(1174,.22,"triangle",.13),120);
  post({type:"gw:score",score});
}
function showLose(){
  overlay.className="overlay show lose"; ovTitle.textContent="Game Over";
  ovText.textContent="No moves left. Final score "+score+".";
  keepBtn.style.display="none"; ovBtn.textContent="Play Again";
  blip(200,.3,"sawtooth",.12);
  post({type:"gw:gameover",score});
}
ovBtn.addEventListener("click",newGame);
keepBtn.addEventListener("click",()=>{ overlay.classList.remove("show"); });

// ---------- controls ----------
function newGame(){
  tileMap.forEach(removeTile); tileMap.clear();
  grid=emptyGrid(); score=0; won=false; dead=false; history=[]; busy=false;
  scoreEl.textContent="0"; overlay.classList.remove("show");
  relayout(); spawn(); spawn();
  post({type:"gw:score",score:0});
}
$("newBtn").addEventListener("click",newGame);
$("undoBtn").addEventListener("click",()=>{
  if(busy||!history.length) return;
  const snap=history.pop(); restoreFrom(snap); won=won; post({type:"gw:score",score});
  blip(420,.08,"sine",.08);
});

document.addEventListener("keydown",e=>{
  const k=e.key;
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"};
  if(map[k]){ e.preventDefault(); firstInteract(); move(map[k]); }
},{passive:false});

// touch swipe
let sx=0,sy=0,st=0,tracking=false;
boardEl.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); tracking=true; firstInteract(); },{passive:true});
boardEl.addEventListener("touchmove",e=>{ if(tracking) e.preventDefault(); },{passive:false});
boardEl.addEventListener("touchend",e=>{
  if(!tracking) return; tracking=false;
  const t=e.changedTouches[0]; handleSwipe(t.clientX-sx, t.clientY-sy);
},{passive:true});
// mouse drag (desktop swipe)
let md=false,mx=0,my=0;
boardEl.addEventListener("mousedown",e=>{ md=true; mx=e.clientX; my=e.clientY; firstInteract(); });
window.addEventListener("mouseup",e=>{ if(!md) return; md=false; handleSwipe(e.clientX-mx,e.clientY-my); });
function handleSwipe(dx,dy){
  const ax=Math.abs(dx), ay=Math.abs(dy); if(Math.max(ax,ay)<24) return;
  if(ax>ay) move(dx>0?"right":"left"); else move(dy>0?"down":"up");
}
let interacted=false;
function firstInteract(){ if(interacted) return; interacted=true; const c=ac(); if(c&&c.state==="suspended") c.resume(); }

// ---------- lifecycle ----------
let ro;
if(window.ResizeObserver){ ro=new ResizeObserver(()=>relayout()); ro.observe(boardEl); }
window.addEventListener("resize",relayout);
window.addEventListener("orientationchange",()=>setTimeout(relayout,200));
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ try{ if(AC) AC.suspend(); }catch(e){} } });

// ---------- boot ----------
function boot(){
  buildBg(); grid=emptyGrid(); relayout(); spawn(); spawn(); relayout();
  post({type:"gw:ready"});
}
boot();
})();
</script>
</body>
</html>
