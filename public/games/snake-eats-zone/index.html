<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snake Eats Zone</title>
<style>
  :root{
    --aqua:#0BE0D0; --navy:#10233F; --pink:#FF4D7D; --yellow:#FFC531;
    --purple:#7C5CFF; --lime:#B8F135; --blue:#00A8FF;
    --font: "Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0a1830; font-family:var(--font);
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 90% at 20% 0%, #163156 0%, rgba(22,49,86,0) 55%),
      radial-gradient(120% 120% at 100% 100%, #0e2748 0%, rgba(14,39,72,0) 60%),
      #0a1830; }
  canvas{ display:block; touch-action:none; }
  .layer{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; color:#eaf3ff; padding:24px; }
  .panel{ background:linear-gradient(180deg, rgba(19,42,74,.82), rgba(13,30,56,.9));
    border:1px solid rgba(120,180,255,.18); border-radius:22px; padding:26px 26px 22px;
    max-width:min(88vw,420px); width:100%; backdrop-filter:blur(6px);
    box-shadow:0 18px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
  h1{ margin:0 0 6px; font-size:clamp(26px,7vw,40px); font-weight:900; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--lime),var(--aqua)); -webkit-background-clip:text;
    background-clip:text; color:transparent; text-shadow:0 2px 18px rgba(11,224,208,.25); }
  .sub{ margin:0 0 18px; color:#a9c2e6; font-weight:700; font-size:15px; line-height:1.4; }
  .big{ font-size:clamp(30px,9vw,48px); }
  button{ font-family:var(--font); cursor:pointer; border:none; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(180deg,var(--lime),#8fd016); color:#0c2a10; font-weight:900;
    font-size:19px; padding:15px 30px; border-radius:16px; width:100%;
    box-shadow:0 8px 22px rgba(184,241,53,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .08s ease, filter .15s ease; }
  .btn:active{ transform:translateY(2px) scale(.99); }
  .btn.sec{ background:linear-gradient(180deg,#22406e,#1a3357); color:#dbe9ff;
    box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08); }
  .row{ display:flex; gap:10px; margin-top:12px; }
  .toggle{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:rgba(10,24,48,.55); border:1px solid rgba(120,180,255,.14);
    border-radius:14px; padding:12px 14px; margin:14px 0 2px; font-weight:800; color:#cfe0f7; font-size:15px; }
  .switch{ position:relative; width:54px; height:30px; border-radius:30px; background:#26456f;
    transition:background .18s ease; flex:0 0 auto; }
  .switch.on{ background:linear-gradient(90deg,var(--aqua),var(--blue)); }
  .knob{ position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; transition:left .18s ease; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .switch.on .knob{ left:27px; }
  .hint{ margin-top:16px; color:#7f9ac2; font-size:13px; font-weight:700; line-height:1.5; }
  .hide{ display:none !important; }
  /* HUD */
  #hud{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:14px 16px; pointer-events:none; z-index:5; }
  .chip{ display:flex; align-items:center; gap:8px; background:rgba(11,26,50,.6);
    border:1px solid rgba(120,180,255,.16); border-radius:14px; padding:8px 14px;
    color:#eaf3ff; font-weight:900; font-size:17px; backdrop-filter:blur(4px);
    box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .chip small{ display:block; font-size:10px; font-weight:800; letter-spacing:1px;
    color:#8fb0dc; text-transform:uppercase; line-height:1; margin-bottom:3px; }
  .chip .val{ line-height:1; }
  .muteBtn{ pointer-events:auto; width:44px; height:44px; border-radius:12px;
    background:rgba(11,26,50,.6); border:1px solid rgba(120,180,255,.16);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .muteBtn svg{ width:22px; height:22px; }
  .flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="flash" id="flash"></div>

  <div id="hud" class="hide">
    <div class="chip"><div><small>Score</small><div class="val" id="score">0</div></div></div>
    <button class="muteBtn" id="mute" aria-label="Toggle sound"></button>
    <div class="chip"><div><small>Best</small><div class="val" id="best">0</div></div></div>
  </div>

  <!-- START -->
  <div class="layer" id="startScreen">
    <div class="panel">
      <h1>SNAKE EATS ZONE</h1>
      <p class="sub">Grow the longest snake. Eat glowing orbs, ramp up the speed, and don't crash into yourself.</p>
      <div class="toggle" id="wrapToggle">
        <span>Wall wrap (portal edges)</span>
        <div class="switch on" id="wrapSwitch"><div class="knob"></div></div>
      </div>
      <div class="row"><button class="btn" id="playBtn">PLAY</button></div>
      <div class="hint">Swipe or use Arrow / WASD keys to steer.<br>Tap left / right side to turn on mobile.</div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="layer hide" id="overScreen">
    <div class="panel">
      <h1 id="overTitle">GAME OVER</h1>
      <p class="sub" id="overSub">Nice run.</p>
      <div class="chip" style="margin:0 auto 14px; display:inline-flex; font-size:22px;">
        <div><small>Score</small><div class="val big" id="finalScore">0</div></div>
      </div>
      <div class="row"><button class="btn" id="againBtn">PLAY AGAIN</button></div>
      <div class="hint" id="bestLine">Best: 0</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const SLUG="snake-eats-zone", HI_KEY="gw_"+SLUG+"_hi";
const C=Object.freeze({aqua:"#0BE0D0",navy:"#10233F",pink:"#FF4D7D",yellow:"#FFC531",
  purple:"#7C5CFF",lime:"#B8F135",blue:"#00A8FF"});
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const flashEl=document.getElementById("flash");
const hud=document.getElementById("hud");
const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startScreen=document.getElementById("startScreen");
const overScreen=document.getElementById("overScreen");
const finalScoreEl=document.getElementById("finalScore");
const bestLineEl=document.getElementById("bestLine");
const overTitle=document.getElementById("overTitle");
const overSub=document.getElementById("overSub");

// ---------- postMessage helper ----------
function post(type,extra){ try{ parent.postMessage(Object.assign({type:type},extra||{}),"*"); }catch(e){} }

// ---------- high score ----------
function getHi(){ try{ return parseInt(localStorage.getItem(HI_KEY)||"0",10)||0; }catch(e){ return 0; } }
function setHi(v){ try{ localStorage.setItem(HI_KEY,String(v)); }catch(e){} }
let best=getHi(); bestEl.textContent=best;

// ---------- audio ----------
let audioCtx=null, muted=false;
try{ muted = localStorage.getItem("gw_muted")==="1"; }catch(e){}
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function blip(freq,dur,type,vol){
  if(muted||!audioCtx) return;
  try{
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.14,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.12));
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+(dur||0.12)+0.02);
  }catch(e){}
}
function eatSound(n){ const f=440+Math.min(n,20)*18; blip(f,0.11,"square",0.12); }
function deathSound(){ blip(180,0.5,"sawtooth",0.16); setTimeout(()=>blip(90,0.5,"sawtooth",0.12),90); }

const muteBtn=document.getElementById("mute");
function muteIcon(){
  muteBtn.innerHTML = muted
   ? '<svg viewBox="0 0 24 24" fill="none" stroke="#8fb0dc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>'
   : '<svg viewBox="0 0 24 24" fill="none" stroke="'+C.aqua+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"/></svg>';
}
muteIcon();
muteBtn.addEventListener("click",()=>{ muted=!muted; try{localStorage.setItem("gw_muted",muted?"1":"0");}catch(e){} muteIcon(); ensureAudio(); });

// ---------- layout / DPR ----------
let W=0,H=0,dpr=1;
// logical grid
let cols=0, rows=0, cell=0, boardX=0, boardY=0, boardW=0, boardH=0;
const TARGET_CELL=26; // px per cell approx

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  dpr=Math.min(window.devicePixelRatio||1, 2);
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // compute grid to fill most of the screen with margin
  const marginX=Math.max(10,W*0.03), marginTop=Math.max(64,H*0.09), marginBottom=Math.max(12,H*0.03);
  const availW=W-marginX*2, availH=H-marginTop-marginBottom;
  cell=Math.max(16, Math.min(availW,availH)/ Math.round(Math.min(availW,availH)/TARGET_CELL));
  cols=Math.max(10, Math.floor(availW/cell));
  rows=Math.max(10, Math.floor(availH/cell));
  boardW=cols*cell; boardH=rows*cell;
  boardX=Math.floor((W-boardW)/2);
  boardY=Math.floor(marginTop+(availH-boardH)/2);
}
window.addEventListener("resize",resize);
resize();

// ---------- game state ----------
let state="start"; // start | play | over
let snake=[], dir={x:1,y:0}, nextDir={x:1,y:0}, food=null, score=0;
let stepMs=140, acc=0, lastT=0, growth=0;
let wrap=true;
let particles=[], pops=[];
let shake=0, flashA=0;

// wrap toggle UI
const wrapSwitch=document.getElementById("wrapSwitch");
document.getElementById("wrapToggle").addEventListener("click",()=>{
  wrap=!wrap; wrapSwitch.classList.toggle("on",wrap); blip(wrap?520:360,0.06,"sine",0.08); ensureAudio();
});

function spawnFood(){
  let tries=0, p;
  do{ p={x:(Math.random()*cols)|0, y:(Math.random()*rows)|0}; tries++; }
  while(tries<200 && snake.some(s=>s.x===p.x&&s.y===p.y));
  p.t=0; food=p;
}

function startGame(){
  ensureAudio();
  resize();
  score=0; scoreEl.textContent="0";
  stepMs=140; acc=0; growth=0;
  const cx=(cols/2)|0, cy=(rows/2)|0;
  snake=[{x:cx-1,y:cy},{x:cx-2,y:cy},{x:cx-3,y:cy}];
  // keep head at index 0
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  particles=[]; pops=[]; shake=0; flashA=0;
  spawnFood();
  state="play";
  startScreen.classList.add("hide");
  overScreen.classList.add("hide");
  hud.classList.remove("hide");
  lastT=performance.now();
  post("gw:score",{score:0});
}

function gameOver(){
  state="over";
  deathSound();
  shake=reduceMotion?0:16; flashA=reduceMotion?0:0.6;
  if(score>best){ best=score; setHi(best); bestEl.textContent=best; }
  finalScoreEl.textContent=score;
  bestLineEl.textContent="Best: "+best;
  overTitle.textContent = score>=best && score>0 ? "NEW BEST!" : "GAME OVER";
  overSub.textContent = score>0 ? ("You reached length "+snake.length+".") : "Steer with swipe or arrow keys.";
  // burst particles at head
  const h=snake[0];
  burst(boardX+h.x*cell+cell/2, boardY+h.y*cell+cell/2, C.pink, 26);
  hud.classList.add("hide");
  overScreen.classList.remove("hide");
  post("gw:gameover",{score:score});
}

function setDir(nx,ny){
  // prevent reversing
  if(nx===-dir.x && ny===-dir.y) return;
  nextDir={x:nx,y:ny};
}

function step(){
  dir=nextDir;
  let hx=snake[0].x+dir.x, hy=snake[0].y+dir.y;
  if(wrap){
    hx=(hx+cols)%cols; hy=(hy+rows)%rows;
  } else {
    if(hx<0||hy<0||hx>=cols||hy>=rows){ gameOver(); return; }
  }
  // self collision (ignore tail cell since it moves, unless growing)
  const willGrow=growth>0;
  const body=willGrow?snake:snake.slice(0,snake.length-1);
  if(body.some(s=>s.x===hx&&s.y===hy)){ gameOver(); return; }
  snake.unshift({x:hx,y:hy});
  if(food && hx===food.x && hy===food.y){
    score+=10; scoreEl.textContent=score;
    growth+=2;
    eatSound(score/10);
    pops.push({x:boardX+food.x*cell+cell/2, y:boardY+food.y*cell+cell/2, r:0, max:cell*1.4, a:1, col:C.yellow});
    burst(boardX+food.x*cell+cell/2, boardY+food.y*cell+cell/2, C.yellow, 12);
    shake=Math.min(shake+ (reduceMotion?0:4), 8);
    // speed ramp
    stepMs=Math.max(62, 140-Math.floor(score/30)*6);
    spawnFood();
    post("gw:score",{score:score});
  }
  if(growth>0){ growth--; } else { snake.pop(); }
}

function burst(x,y,color,n){
  if(reduceMotion) n=Math.min(n,6);
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:2+Math.random()*3,col:color});
  }
}

// ---------- input ----------
window.addEventListener("keydown",(e)=>{
  const k=e.key;
  if(k==="ArrowUp"||k==="w"||k==="W") setDir(0,-1);
  else if(k==="ArrowDown"||k==="s"||k==="S") setDir(0,1);
  else if(k==="ArrowLeft"||k==="a"||k==="A") setDir(-1,0);
  else if(k==="ArrowRight"||k==="d"||k==="D") setDir(1,0);
  else if(k===" "){ if(state==="start"){startGame();} else if(state==="over"){startGame();} }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(k)) e.preventDefault();
},{passive:false});

// swipe + tap steering
let touchStart=null, touchMoved=false;
function onDown(x,y){ touchStart={x,y,t:performance.now()}; touchMoved=false; }
function onMove(x,y){
  if(!touchStart) return;
  const dx=x-touchStart.x, dy=y-touchStart.y;
  if(Math.abs(dx)>24||Math.abs(dy)>24){
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0);
    else setDir(0,dy>0?1:-1);
    touchStart={x,y,t:performance.now()}; touchMoved=true;
  }
}
function onUp(x,y){
  if(!touchStart) return;
  if(!touchMoved){
    // tap: steer relative to head direction — tap left half = turn left, right half = turn right
    const half=W/2;
    // rotate current direction
    if(x<half){ setDir(dir.y, -dir.x); } // turn left (CCW)
    else { setDir(-dir.y, dir.x); }       // turn right (CW)
  }
  touchStart=null;
}
canvas.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; onDown(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
canvas.addEventListener("touchmove",e=>{ const t=e.changedTouches[0]; onMove(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
canvas.addEventListener("touchend",e=>{ const t=e.changedTouches[0]; onUp(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
let mouseDown=false;
canvas.addEventListener("mousedown",e=>{ mouseDown=true; onDown(e.clientX,e.clientY); });
canvas.addEventListener("mousemove",e=>{ if(mouseDown) onMove(e.clientX,e.clientY); });
window.addEventListener("mouseup",e=>{ if(mouseDown){ onUp(e.clientX,e.clientY); mouseDown=false; } });

document.getElementById("playBtn").addEventListener("click",startGame);
document.getElementById("againBtn").addEventListener("click",startGame);

// ---------- rendering ----------
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBoard(){
  // board background
  roundRect(boardX-6,boardY-6,boardW+12,boardH+12,18);
  ctx.fillStyle="rgba(9,22,44,.75)"; ctx.fill();
  ctx.strokeStyle=wrap?"rgba(11,224,208,.35)":"rgba(255,77,125,.35)"; ctx.lineWidth=2; ctx.stroke();
  // subtle grid dots
  ctx.fillStyle="rgba(120,170,230,.06)";
  for(let i=0;i<=cols;i++){ for(let j=0;j<=rows;j++){
    if((i+j)%2===0){ ctx.fillRect(boardX+i*cell-1, boardY+j*cell-1, 2,2); }
  }}
}
function drawFood(){
  if(!food) return;
  food.t+=0.06;
  const cx=boardX+food.x*cell+cell/2, cy=boardY+food.y*cell+cell/2;
  const pulse=1+Math.sin(food.t*3)*0.08;
  const r=cell*0.34*pulse;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,cell*1.1);
  g.addColorStop(0,"rgba(255,197,49,.5)"); g.addColorStop(1,"rgba(255,197,49,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,cell*1.0,0,7); ctx.fill();
  const grd=ctx.createRadialGradient(cx-r*0.3,cy-r*0.3,r*0.1,cx,cy,r);
  grd.addColorStop(0,"#FFE99A"); grd.addColorStop(1,C.yellow);
  ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(cx-r*0.32,cy-r*0.34,r*0.28,0,7); ctx.fill();
}
function lerp(a,b,t){ return a+(b-a)*t; }
function hexToRgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
const HEAD=hexToRgb(C.lime), TAIL=hexToRgb(C.aqua);
function drawSnake(){
  const n=snake.length;
  for(let i=n-1;i>=0;i--){
    const s=snake[i];
    const t=n>1? i/(n-1):0;
    const r=Math.round(lerp(HEAD[0],TAIL[0],t)), g=Math.round(lerp(HEAD[1],TAIL[1],t)), b=Math.round(lerp(HEAD[2],TAIL[2],t));
    const pad=cell*0.10;
    const x=boardX+s.x*cell+pad, y=boardY+s.y*cell+pad, sz=cell-pad*2;
    if(i===0){
      ctx.shadowColor="rgba(184,241,53,.6)"; ctx.shadowBlur=reduceMotion?0:14;
    } else { ctx.shadowBlur=0; }
    roundRect(x,y,sz,sz,sz*0.34);
    ctx.fillStyle="rgb("+r+","+g+","+b+")"; ctx.fill();
    ctx.shadowBlur=0;
    // gloss
    ctx.fillStyle="rgba(255,255,255,.18)";
    roundRect(x+sz*0.14,y+sz*0.12,sz*0.72,sz*0.3,sz*0.2); ctx.fill();
    if(i===0) drawEyes(s);
  }
}
function drawEyes(head){
  const cx=boardX+head.x*cell+cell/2, cy=boardY+head.y*cell+cell/2;
  const ex=dir.x, ey=dir.y;
  const off=cell*0.17, eo=cell*0.12;
  // two eyes perpendicular to direction
  const px=-ey, py=ex;
  for(const s of [-1,1]){
    const exx=cx+ex*off + px*eo*s, eyy=cy+ey*off + py*eo*s;
    ctx.fillStyle="#0c2a10"; ctx.beginPath(); ctx.arc(exx,eyy,cell*0.09,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(exx-cell*0.03,eyy-cell*0.03,cell*0.035,0,7); ctx.fill();
  }
}
function drawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.98; p.life-=dt*0.0022;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.r+=(p.max-p.r)*0.2; p.a-=dt*0.004;
    if(p.a<=0){ pops.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.a); ctx.strokeStyle=p.col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

// ---------- main loop ----------
let paused=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-lastT; lastT=now;
  if(dt>100) dt=100; // clamp after tab switch
  ctx.clearRect(0,0,W,H);

  let sx=0,sy=0;
  if(shake>0){ sx=(Math.random()*2-1)*shake; sy=(Math.random()*2-1)*shake; shake*=0.86; if(shake<0.4)shake=0; }
  ctx.save(); ctx.translate(sx,sy);

  drawBoard();

  if(state==="play" && !paused){
    acc+=dt;
    while(acc>=stepMs){ acc-=stepMs; if(state==="play") step(); }
  }
  drawFood();
  if(state!=="start") drawSnake();
  drawParticles(dt);

  ctx.restore();

  if(flashA>0){ flashEl.style.opacity=flashA; flashA-=dt*0.0016; if(flashA<0)flashA=0; }
  else flashEl.style.opacity=0;
}
requestAnimationFrame(frame);

// pause on hide
document.addEventListener("visibilitychange",()=>{ paused=document.hidden; if(!paused) lastT=performance.now(); });

post("gw:ready",{slug:SLUG});
})();
</script>
