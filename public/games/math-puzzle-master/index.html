<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Math Puzzle Master</title>
<style>
  :root{
    --aqua:#0BE0D0; --navy:#10233F; --pink:#FF4D7D; --yellow:#FFC531;
    --purple:#7C5CFF; --lime:#B8F135; --blue:#00A8FF; --orange:#FF8A00;
    --bg0:#0b1830; --bg1:#152a4d; --ink:#eaf2ff; --ink-dim:#9fb2d0;
    --font:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font); color:var(--ink); overflow:hidden;
    background:radial-gradient(120% 120% at 15% 0%,var(--bg1),var(--bg0) 62%);
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
    display:flex; flex-direction:column;
  }
  .wrap{flex:1; display:flex; flex-direction:column; width:100%; max-width:620px; margin:0 auto;
    padding:14px clamp(12px,3.5vw,26px); gap:14px; min-height:0;}
  header{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand h1{font-size:clamp(18px,4.8vw,26px); font-weight:1000; letter-spacing:-.5px;
    background:linear-gradient(90deg,var(--lime),var(--aqua)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .brand span{font-size:10px; color:var(--ink-dim); font-weight:800; letter-spacing:.4px;}
  .hud{display:flex; align-items:center; gap:10px;}
  .lives{display:flex; gap:5px;}
  .heart{width:20px; height:20px; transition:transform .2s, opacity .3s;}
  .heart.lost{opacity:.18; transform:scale(.7);}
  .stat{text-align:right;}
  .stat b{display:block; font-size:9px; color:var(--ink-dim); font-weight:800; letter-spacing:1px;}
  .stat s{display:block; font-size:clamp(16px,4.4vw,22px); font-weight:1000; text-decoration:none;}
  button.ghost{background:rgba(255,255,255,.07); color:var(--ink); border:1px solid rgba(255,255,255,.1);
    width:40px; height:40px; padding:0; display:grid; place-items:center; border-radius:12px; cursor:pointer;}
  button.ghost:active{transform:scale(.94);} button.ghost svg{width:18px;height:18px;}
  .timerbar{height:12px; border-radius:8px; background:rgba(255,255,255,.08); overflow:hidden; position:relative;}
  .timerfill{position:absolute; left:0; top:0; bottom:0; width:100%;
    background:linear-gradient(90deg,var(--lime),var(--aqua)); border-radius:8px;}
  .combo{display:flex; align-items:center; justify-content:center; gap:8px; min-height:22px;}
  .combo .pill{font-size:12px; font-weight:900; padding:4px 12px; border-radius:20px;
    background:linear-gradient(90deg,var(--orange),var(--pink)); color:#fff; opacity:0; transform:scale(.6); transition:.18s;}
  .combo .pill.show{opacity:1; transform:scale(1);}
  .qarea{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:0;}
  .level{font-size:11px; font-weight:900; letter-spacing:2px; color:var(--ink-dim);}
  .question{font-size:clamp(40px,13vw,86px); font-weight:1000; letter-spacing:-2px; line-height:1;
    text-align:center; transition:transform .2s;}
  .question.pulse{animation:qp .25s ease;}
  @keyframes qp{0%{transform:scale(.85);opacity:.4}100%{transform:scale(1);opacity:1}}
  .answers{display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,2.6vw,16px); padding-bottom:6px;}
  .ans{font-family:var(--font); font-weight:1000; font-size:clamp(22px,6vw,34px); color:var(--ink);
    border:none; cursor:pointer; border-radius:18px; padding:clamp(16px,4.5vw,28px) 8px;
    background:linear-gradient(180deg,rgba(124,92,255,.28),rgba(22,41,75,.9));
    border:1px solid rgba(255,255,255,.1); box-shadow:0 6px 0 rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .07s, box-shadow .07s, background .2s;}
  .ans:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.28);}
  .ans.correct{background:linear-gradient(180deg,var(--lime),#8fbe1e); color:var(--navy); box-shadow:0 6px 0 #6f9615;}
  .ans.wrong{background:linear-gradient(180deg,var(--pink),#c93762); color:#fff; box-shadow:0 6px 0 #8f2547; animation:shake .3s;}
  .ans.dim{opacity:.4;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .overlay{position:absolute; inset:0; z-index:20; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:16px; padding:24px;
    background:radial-gradient(120% 120% at 50% 35%,rgba(16,35,63,.86),rgba(11,24,48,.96));}
  .overlay.show{display:flex; animation:fade .3s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay h2{font-size:clamp(28px,8vw,46px); font-weight:1000; letter-spacing:-1px;}
  .start h2{background:linear-gradient(90deg,var(--lime),var(--aqua)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .over h2{background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .overlay p{color:var(--ink-dim); font-size:15px; font-weight:700; max-width:320px;}
  button.btn{font-family:var(--font); font-weight:900; color:var(--navy); cursor:pointer; border:none;
    border-radius:14px; padding:14px 30px; font-size:17px;
    background:linear-gradient(180deg,var(--aqua),#08b6ab); box-shadow:0 5px 0 #067a72; transition:transform .08s, box-shadow .08s;}
  button.btn:active{transform:translateY(3px); box-shadow:0 2px 0 #067a72;}
  .big{font-size:clamp(20px,6vw,30px); font-weight:1000;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;} }
  #fx{position:absolute; inset:0; pointer-events:none; z-index:10; overflow:hidden;}
</style>
</head>
<body>
<div id="fx"></div>
<div class="wrap">
  <header>
    <div class="brand"><h1>Math Master</h1><span>SOLVE. STREAK. SURVIVE.</span></div>
    <div class="hud">
      <div class="lives" id="lives"></div>
      <div class="stat"><b>SCORE</b><s id="score">0</s></div>
      <button class="ghost" id="muteBtn" aria-label="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
      </button>
    </div>
  </header>
  <div class="timerbar"><div class="timerfill" id="timerfill"></div></div>
  <div class="combo"><span class="pill" id="combo">STREAK x2</span></div>
  <div class="qarea">
    <div class="level" id="level">LEVEL 1</div>
    <div class="question" id="question">7 + 5</div>
  </div>
  <div class="answers" id="answers"></div>
</div>

<div class="overlay start show" id="startOv">
  <h2>Math Puzzle Master</h2>
  <p>Solve as fast as you can. Build a streak for bonus points. Three wrong answers or timeouts and it is over.</p>
  <button class="btn" id="startBtn">Start</button>
</div>
<div class="overlay over" id="overOv">
  <h2>Time&#39;s Up</h2>
  <p id="overText"></p>
  <div class="big" id="overScore"></div>
  <button class="btn" id="againBtn">Play Again</button>
</div>

<script>
(function(){
"use strict";
const SLUG="math-puzzle-master", HI_KEY="gw_"+SLUG+"_hi", MAX_LIVES=3;
const $=id=>document.getElementById(id);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let score=0, best=0, lives=MAX_LIVES, streak=0, level=1, qCount=0;
let current=null, timeLeft=0, timeMax=0, running=false, lastTs=0, locked=false;

try{ best=parseInt(localStorage.getItem(HI_KEY)||"0",10)||0; }catch(e){}

// audio
let AC=null, muted=false;
try{ muted=localStorage.getItem("gw_"+SLUG+"_mute")==="1"; }catch(e){}
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function blip(f,d,t,v){ if(muted) return; const c=ac(); if(!c) return; try{
  if(c.state==="suspended")c.resume();
  const o=c.createOscillator(),g=c.createGain(); o.type=t||"sine"; o.frequency.value=f;
  o.connect(g); g.connect(c.destination); const n=c.currentTime;
  g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(v||.12,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+(d||.14)); o.start(n); o.stop(n+(d||.14)+.02);
}catch(e){} }
function goodSound(n){ blip(520+Math.min(n,8)*60,.12,"triangle",.12); }
function updateMute(){ $("muteBtn").style.opacity=muted?".45":"1"; }
$("muteBtn").addEventListener("click",()=>{ muted=!muted; try{localStorage.setItem("gw_"+SLUG+"_mute",muted?"1":"0");}catch(e){} updateMute(); if(!muted) blip(660,.1,"sine",.1); });
updateMute();

function post(m){ try{ window.parent&&window.parent.postMessage(m,"*"); }catch(e){} }

// hearts
function renderLives(){
  const el=$("lives"); el.innerHTML="";
  for(let i=0;i<MAX_LIVES;i++){
    const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","heart"+(i>=lives?" lost":""));
    s.innerHTML='<path d="M12 21s-7.5-4.9-9.7-9.2C.6 8.6 2 5.5 5 5.1c1.9-.3 3.4.7 4.3 2 .3.4.9.4 1.3 0 .9-1.3 2.4-2.3 4.3-2 3 .4 4.4 3.5 2.7 6.7C19.5 16.1 12 21 12 21z" fill="#FF4D7D"/>';
    el.appendChild(s);
  }
}

// ---- question generation ----
function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function makeQuestion(){
  const lv=level;
  let ops=["+","-"];
  if(lv>=2) ops.push("x");
  if(lv>=4) ops.push("/");
  const op=ops[(Math.random()*ops.length)|0];
  let a,b,ans,text;
  const scale=1+lv;
  if(op==="+"){ a=ri(2,8+lv*4); b=ri(2,8+lv*4); ans=a+b; text=a+" + "+b; }
  else if(op==="-"){ a=ri(4,10+lv*4); b=ri(1,a); ans=a-b; text=a+" − "+b; }
  else if(op==="x"){ a=ri(2,3+Math.min(9,lv+2)); b=ri(2,3+Math.min(9,lv+2)); ans=a*b; text=a+" × "+b; }
  else { b=ri(2,3+Math.min(8,lv)); ans=ri(2,3+Math.min(9,lv+2)); a=b*ans; text=a+" ÷ "+b; }
  // distractors
  const set=new Set([ans]); const opts=[];
  let guard=0;
  while(opts.length<3 && guard++<50){
    let delta=ri(1,Math.max(3,Math.round(Math.abs(ans)*0.25)+lv));
    if(Math.random()<0.5) delta=-delta;
    let d=ans+delta;
    if(d<0) d=Math.abs(ans)+ri(1,5);
    if(!set.has(d)){ set.add(d); opts.push(d); }
  }
  while(opts.length<3){ let d=ans+opts.length+1; if(!set.has(d)){set.add(d);opts.push(d);} }
  const choices=[ans,...opts];
  for(let i=choices.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [choices[i],choices[j]]=[choices[j],choices[i]]; }
  return { text, ans, choices };
}

function timeForLevel(){ return Math.max(2.6, 6 - level*0.35); }

function nextQuestion(){
  qCount++;
  level = 1 + Math.floor(qCount/5);
  $("level").textContent="LEVEL "+level;
  current=makeQuestion();
  const q=$("question"); q.textContent=current.text;
  q.classList.remove("pulse"); void q.offsetWidth; if(!reduce) q.classList.add("pulse");
  const ansEl=$("answers"); ansEl.innerHTML="";
  current.choices.forEach(val=>{
    const b=document.createElement("button"); b.className="ans"; b.textContent=val;
    b.addEventListener("click",()=>answer(val,b));
    ansEl.appendChild(b);
  });
  timeMax=timeForLevel(); timeLeft=timeMax; locked=false;
}

function answer(val,btn){
  if(locked||!running) return;
  locked=true;
  const correct = val===current.ans;
  if(correct){
    streak++;
    const mult = streak>=2 ? Math.min(5, 1+Math.floor(streak/2)) : 1;
    const timeBonus=Math.round((timeLeft/timeMax)*10);
    const gained=(10 + level*2 + timeBonus)*mult;
    addScore(gained);
    btn.classList.add("correct");
    goodSound(streak);
    if(streak>=2){ showCombo("STREAK x"+mult); if(streak%3===0) confetti(); }
    // disable others
    [...$("answers").children].forEach(c=>{ if(c!==btn) c.classList.add("dim"); });
    setTimeout(nextQuestion, reduce?60:230);
  } else {
    btn.classList.add("wrong");
    streak=0; hideCombo();
    blip(180,.22,"sawtooth",.12);
    // highlight correct
    [...$("answers").children].forEach(c=>{ if(c.textContent==String(current.ans)) c.classList.add("correct"); else if(c!==btn) c.classList.add("dim"); });
    loseLife();
    if(lives>0) setTimeout(nextQuestion, reduce?80:520);
  }
}

function addScore(n){
  score+=n; $("score").textContent=score;
  if(score>best){ best=score; try{localStorage.setItem(HI_KEY,String(best));}catch(e){} }
  post({type:"gw:score",score});
}
function loseLife(){
  lives--; renderLives();
  const hearts=$("lives").children; if(hearts[lives]) hearts[lives].classList.add("lost");
  if(lives<=0){ setTimeout(gameOver, reduce?100:420); }
}

// combo pill
let comboTimer=null;
function showCombo(t){ const p=$("combo"); p.textContent=t; p.classList.add("show");
  clearTimeout(comboTimer); comboTimer=setTimeout(()=>p.classList.remove("show"),1200); }
function hideCombo(){ $("combo").classList.remove("show"); }

// timer loop
function loop(ts){
  if(!running){ return; }
  if(!lastTs) lastTs=ts;
  const dt=(ts-lastTs)/1000; lastTs=ts;
  if(!locked){
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; onTimeout(); }
  }
  const frac=Math.max(0,timeLeft/timeMax);
  const fill=$("timerfill"); fill.style.width=(frac*100)+"%";
  fill.style.background = frac<0.3 ? "linear-gradient(90deg,#FF4D7D,#FF8A00)" : (frac<0.6?"linear-gradient(90deg,#FFC531,#B8F135)":"linear-gradient(90deg,#B8F135,#0BE0D0)");
  requestAnimationFrame(loop);
}
function onTimeout(){
  if(locked) return; locked=true;
  streak=0; hideCombo(); blip(160,.3,"sawtooth",.12);
  [...$("answers").children].forEach(c=>{ if(c.textContent==String(current.ans)) c.classList.add("correct"); else c.classList.add("dim"); });
  loseLife();
  if(lives>0) setTimeout(nextQuestion, reduce?80:520);
}

// confetti
function confetti(){
  if(reduce) return; const fx=$("fx"); const cols=["#0BE0D0","#FF4D7D","#FFC531","#7C5CFF","#B8F135"];
  for(let i=0;i<18;i++){ const d=document.createElement("div");
    d.style.cssText="position:absolute;width:9px;height:9px;border-radius:2px;top:30%;left:"+(30+Math.random()*40)+"%;background:"+cols[i%cols.length];
    fx.appendChild(d);
    const dx=(Math.random()*2-1)*180, dy=120+Math.random()*220;
    d.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:700+Math.random()*500,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>d.remove();
  }
}

// flow
function start(){
  score=0; lives=MAX_LIVES; streak=0; level=1; qCount=0; locked=false;
  $("score").textContent="0"; renderLives(); hideCombo();
  $("startOv").classList.remove("show"); $("overOv").classList.remove("show");
  running=true; lastTs=0;
  nextQuestion();
  requestAnimationFrame(loop);
  post({type:"gw:score",score:0});
}
function gameOver(){
  running=false;
  $("overText").textContent="You answered "+qCount+" questions and reached level "+level+".";
  $("overScore").textContent="Score "+score+"  ·  Best "+best;
  $("overOv").classList.add("show");
  blip(200,.35,"sawtooth",.12);
  post({type:"gw:gameover",score});
}
$("startBtn").addEventListener("click",()=>{ firstInteract(); start(); });
$("againBtn").addEventListener("click",()=>{ firstInteract(); start(); });

let interacted=false;
function firstInteract(){ if(interacted) return; interacted=true; const c=ac(); if(c&&c.state==="suspended") c.resume(); }

// keyboard 1-4
document.addEventListener("keydown",e=>{
  if(!running||locked) return;
  const n=parseInt(e.key,10);
  if(n>=1&&n<=4){ const btn=$("answers").children[n-1]; if(btn) btn.click(); }
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ if(running){ running=false; wasRunning=true; } try{AC&&AC.suspend();}catch(e){} }
  else if(wasRunning){ wasRunning=false; running=true; lastTs=0; requestAnimationFrame(loop); }
});
let wasRunning=false;

renderLives();
post({type:"gw:ready"});
})();
</script>
</body>
</html>
