<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bubble Pop Mania</title>
<style>
  :root{
    --aqua:#0BE0D0; --navy:#10233F; --pink:#FF4D7D; --yellow:#FFC531;
    --purple:#7C5CFF; --lime:#B8F135; --blue:#00A8FF;
    --font:"Nunito", ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0a1830; font-family:var(--font);
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(120% 90% at 50% -10%, #17335c 0%, rgba(23,51,92,0) 55%),
      radial-gradient(120% 120% at 100% 110%, #241653 0%, rgba(36,22,83,0) 60%),
      #0a1830; }
  canvas{ display:block; touch-action:none; }
  .layer{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; color:#eaf3ff; padding:24px; }
  .panel{ background:linear-gradient(180deg, rgba(19,36,74,.86), rgba(13,26,56,.93));
    border:1px solid rgba(140,160,255,.2); border-radius:22px; padding:26px 26px 22px;
    max-width:min(88vw,420px); width:100%; backdrop-filter:blur(6px);
    box-shadow:0 18px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
  h1{ margin:0 0 6px; font-size:clamp(24px,7vw,38px); font-weight:900; letter-spacing:.5px;
    background:linear-gradient(90deg,var(--aqua),var(--purple)); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .sub{ margin:0 0 18px; color:#b3c2e6; font-weight:700; font-size:15px; line-height:1.4; }
  .big{ font-size:clamp(30px,9vw,48px); }
  button{ font-family:var(--font); cursor:pointer; border:none; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(180deg,var(--aqua),#07b6ac); color:#04231f; font-weight:900;
    font-size:19px; padding:15px 30px; border-radius:16px; width:100%;
    box-shadow:0 8px 22px rgba(11,224,208,.38), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .08s ease; }
  .btn:active{ transform:translateY(2px) scale(.99); }
  .hint{ margin-top:16px; color:#8fa0c6; font-size:13px; font-weight:700; line-height:1.5; }
  .hide{ display:none !important; }
  #hud{ position:absolute; top:0; left:0; right:0; display:flex; align-items:flex-start;
    justify-content:space-between; padding:12px 14px; pointer-events:none; z-index:5; gap:10px; }
  .chip{ background:rgba(11,26,50,.62); border:1px solid rgba(140,160,255,.18);
    border-radius:14px; padding:7px 13px; color:#eaf3ff; font-weight:900; font-size:18px;
    backdrop-filter:blur(4px); box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .chip small{ display:block; font-size:9px; font-weight:800; letter-spacing:1px;
    color:#9fb0dc; text-transform:uppercase; line-height:1; margin-bottom:3px; }
  .muteBtn{ pointer-events:auto; width:40px; height:40px; border-radius:11px;
    background:rgba(11,26,50,.62); border:1px solid rgba(140,160,255,.18);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .muteBtn svg{ width:21px; height:21px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hide">
    <div class="chip"><small>Score</small><span id="score">0</span></div>
    <button class="muteBtn" id="mute" aria-label="Toggle sound"></button>
    <div class="chip"><small>Level</small><span id="level">1</span></div>
  </div>

  <div class="layer" id="startScreen">
    <div class="panel">
      <h1>BUBBLE POP MANIA</h1>
      <p class="sub">Aim and shoot. Match 3 or more of the same color to pop them in satisfying chains. Clear the board before the bubbles crush the line.</p>
      <button class="btn" id="playBtn">PLAY</button>
      <div class="hint">Aim with mouse or finger, release to fire.<br>Bank shots off the walls.</div>
    </div>
  </div>

  <div class="layer hide" id="overScreen">
    <div class="panel">
      <h1 id="overTitle">GAME OVER</h1>
      <p class="sub" id="overSub"></p>
      <div class="chip" style="display:inline-block; margin:0 auto 14px; font-size:24px;">
        <small>Score</small><span class="big" id="finalScore">0</span>
      </div>
      <button class="btn" id="againBtn">PLAY AGAIN</button>
      <div class="hint" id="bestLine">Best: 0</div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
const SLUG="bubble-pop-mania", HI_KEY="gw_"+SLUG+"_hi";
const C=Object.freeze({aqua:"#0BE0D0",navy:"#10233F",pink:"#FF4D7D",yellow:"#FFC531",
  purple:"#7C5CFF",lime:"#B8F135",blue:"#00A8FF"});
const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const PAL=[C.pink,C.yellow,C.aqua,C.purple,C.blue,C.lime];
function darker(hex,f){ f=f||0.55; const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return "rgb("+Math.round(r*f)+","+Math.round(g*f)+","+Math.round(b*f)+")"; }
function lighter(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return "rgb("+Math.min(255,r+80)+","+Math.min(255,g+80)+","+Math.min(255,b+80)+")"; }

const canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const hud=document.getElementById("hud"), scoreEl=document.getElementById("score"), levelEl=document.getElementById("level");
const startScreen=document.getElementById("startScreen"), overScreen=document.getElementById("overScreen");
const finalScoreEl=document.getElementById("finalScore"), bestLineEl=document.getElementById("bestLine");
const overTitle=document.getElementById("overTitle"), overSub=document.getElementById("overSub");

function post(type,extra){ try{ parent.postMessage(Object.assign({type},extra||{}),"*"); }catch(e){} }
function getHi(){ try{ return parseInt(localStorage.getItem(HI_KEY)||"0",10)||0; }catch(e){ return 0; } }
function setHi(v){ try{ localStorage.setItem(HI_KEY,String(v)); }catch(e){} }
let best=getHi();

// audio
let audioCtx=null, muted=false;
try{ muted=localStorage.getItem("gw_muted")==="1"; }catch(e){}
function ensureAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function tone(freq,dur,type,vol,slideTo){
  if(muted||!audioCtx) return;
  try{ const t=audioCtx.currentTime; const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.12,t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function shootSound(){ tone(420,0.09,"square",0.08,300); }
function popSound(n){ tone(500+n*40,0.12,"sine",0.13,900+n*60); }
function stickSound(){ tone(260,0.06,"sine",0.08); }
function dropSound(){ tone(200,0.2,"triangle",0.1,90); }
function loseSound(){ tone(160,0.5,"sawtooth",0.16,60); }

const muteBtn=document.getElementById("mute");
function muteIcon(){
  muteBtn.innerHTML=muted
   ?'<svg viewBox="0 0 24 24" fill="none" stroke="#9fb0dc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>'
   :'<svg viewBox="0 0 24 24" fill="none" stroke="'+C.aqua+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"/></svg>';
}
muteIcon();
muteBtn.addEventListener("click",e=>{ e.stopPropagation(); muted=!muted; try{localStorage.setItem("gw_muted",muted?"1":"0");}catch(_){} muteIcon(); ensureAudio(); });

// layout
let W=0,H=0,dpr=1;
let COLS=9, R=20, colStep=40, rowStep=34, boardX=0, boardY=0, boardW=0;
let shooterY=0, deathLineY=0;
function computeLayout(){
  W=window.innerWidth; H=window.innerHeight; dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  COLS=Math.max(7, Math.min(12, Math.round(W/58)));
  boardW=Math.min(W*0.98, W-8);
  R=boardW/(COLS*2);
  colStep=2*R; rowStep=R*1.732;
  boardX=(W-boardW)/2; boardY=Math.max(50, H*0.08);
  shooterY=H-Math.max(64, H*0.11);
  deathLineY=shooterY-R*2.2;
}
computeLayout();
window.addEventListener("resize",()=>{ computeLayout(); });

// game state
let state="start";
let grid=[]; // grid[i] = array of colorIndex|null
let slide=0, descentSpeed=0;
let colorsInPlay=5, level=1, score=0;
let shotsFired=0;
let fly=null; // moving bubble
let current=0, next=0; // color indices
let aimAngle=-Math.PI/2, aiming=false;
let particles=[], drops=[], popRings=[];
let shake=0, lastT=0, paused=false;

function rowLen(i){ return (i%2===0)? COLS : COLS-1; }
function centerX(i,j){ return boardX + R + (i%2)*R + j*colStep; }
function centerY(i){ return boardY + R + i*rowStep + slide; }

function randColor(){ return (Math.random()*colorsInPlay)|0; }
function newRow(i){ const len=rowLen(i); const a=[]; for(let j=0;j<len;j++) a.push(randColor()); return a; }

function colorsPresent(){
  const set=new Set();
  for(let i=0;i<grid.length;i++){ const row=grid[i]; if(!row)continue;
    for(let j=0;j<row.length;j++){ if(row[j]!=null) set.add(row[j]); } }
  return [...set];
}
function pickShooterColor(){
  const p=colorsPresent();
  if(p.length===0) return randColor();
  return p[(Math.random()*p.length)|0];
}

function buildLevel(){
  grid=[]; slide=0;
  const rows=Math.min(5+Math.floor((level-1)*0.7), 9);
  for(let i=0;i<rows;i++) grid.push(newRow(i));
  colorsInPlay=Math.min(6, 4+Math.floor((level-1)/2));
  descentSpeed=(0.10+ (level-1)*0.03) * R/26; // px per frame-ish, scaled
}

function startGame(){
  ensureAudio(); computeLayout();
  state="play"; score=0; level=1; shotsFired=0;
  particles=[]; drops=[]; popRings=[]; fly=null; shake=0;
  buildLevel();
  current=pickShooterColor(); next=pickShooterColor();
  scoreEl.textContent="0"; levelEl.textContent="1";
  startScreen.classList.add("hide"); overScreen.classList.add("hide"); hud.classList.remove("hide");
  lastT=performance.now();
  post("gw:score",{score:0});
}
function endGame(win){
  state="over";
  if(score>best){ best=score; setHi(best); }
  finalScoreEl.textContent=score; bestLineEl.textContent="Best: "+best;
  overTitle.textContent = score>=best&&score>0 ? "NEW BEST!" : (win?"CLEARED!":"GAME OVER");
  overSub.textContent = "You reached level "+level+".";
  hud.classList.add("hide"); overScreen.classList.remove("hide");
  loseSound();
  post("gw:gameover",{score});
}

// neighbors
function neighbors(i,j){
  const out=[];
  const even=(i%2===0);
  const cand = even
    ? [[i,j-1],[i,j+1],[i-1,j-1],[i-1,j],[i+1,j-1],[i+1,j]]
    : [[i,j-1],[i,j+1],[i-1,j],[i-1,j+1],[i+1,j],[i+1,j+1]];
  for(const [a,b] of cand){ if(a<0||b<0) continue; if(b>=rowLen(a)) continue; out.push([a,b]); }
  return out;
}
function isFilled(i,j){ return i>=0 && i<grid.length && grid[i] && j>=0 && j<grid[i].length && grid[i][j]!=null; }

// place flying bubble into nearest empty cell
function snapFly(){
  const fx=fly.x, fy=fly.y, col=fly.color;
  // approximate row
  let bestCell=null, bestD=Infinity;
  const iApprox=Math.round((fy-boardY-R-slide)/rowStep);
  for(let di=-2; di<=2; di++){
    const i=iApprox+di; if(i<0) continue;
    const len=rowLen(i);
    const jApprox=Math.round((fx-boardX-R-(i%2)*R)/colStep);
    for(let dj=-2; dj<=2; dj++){
      const j=jApprox+dj; if(j<0||j>=len) continue;
      if(isFilled(i,j)) continue;
      // must be top row OR adjacent to a filled bubble
      let ok = (i===0);
      if(!ok){ for(const [a,b] of neighbors(i,j)){ if(isFilled(a,b)){ ok=true; break; } } }
      if(!ok) continue;
      const cx=centerX(i,j), cy=centerY(i);
      const d=(cx-fx)*(cx-fx)+(cy-fy)*(cy-fy);
      if(d<bestD){ bestD=d; bestCell=[i,j]; }
    }
  }
  if(!bestCell){
    // fallback: expand rows array and drop at approx
    let i=Math.max(0,iApprox), len=rowLen(i);
    let j=Math.max(0,Math.min(len-1, Math.round((fx-boardX-R-(i%2)*R)/colStep)));
    while(grid.length<=i) grid.push(new Array(rowLen(grid.length)).fill(null));
    // find nearest empty in that row
    if(isFilled(i,j)){ for(let k=0;k<len;k++){ if(!isFilled(i,j+k)){ j=j+k; break;} if(!isFilled(i,j-k)){ j=j-k; break; } } }
    bestCell=[i,Math.max(0,Math.min(len-1,j))];
  }
  const [i,j]=bestCell;
  while(grid.length<=i) grid.push(new Array(rowLen(grid.length)).fill(null));
  grid[i][j]=col;
  stickSound();
  resolvePlacement(i,j);
}

function resolvePlacement(i,j){
  const col=grid[i][j];
  // flood same color
  const seen={}, stack=[[i,j]], cluster=[];
  seen[i+","+j]=true;
  while(stack.length){
    const [a,b]=stack.pop(); cluster.push([a,b]);
    for(const [na,nb] of neighbors(a,b)){
      const key=na+","+nb;
      if(!seen[key] && isFilled(na,nb) && grid[na][nb]===col){ seen[key]=true; stack.push([na,nb]); }
    }
  }
  if(cluster.length>=3){
    let n=0;
    for(const [a,b] of cluster){
      spawnPop(centerX(a,b),centerY(a),PAL[grid[a][b]]);
      grid[a][b]=null; n++;
    }
    const gained=n*10 + (n>=5? (n-4)*25:0);
    addScore(gained);
    popSound(n);
    shake=Math.min(shake+(reduceMotion?0:Math.min(n,7)),9);
    // drop floaters
    dropFloaters();
  }
  // check win
  if(colorsPresent().length===0){
    levelUp();
  } else {
    // check lose (bubbles crossed line)
    checkLose();
  }
}

function levelUp(){
  addScore(200);
  level++; levelEl.textContent=level;
  buildLevel();
  current=pickShooterColor(); next=pickShooterColor();
  for(let k=0;k<40;k++) spawnPop(W/2, H/2, PAL[k%PAL.length]);
}

function dropFloaters(){
  // BFS from top filled cells
  const connected={};
  const stack=[];
  for(let j=0;j<rowLen(0);j++){ if(isFilled(0,j)){ connected["0,"+j]=true; stack.push([0,j]); } }
  while(stack.length){
    const [a,b]=stack.pop();
    for(const [na,nb] of neighbors(a,b)){
      const key=na+","+nb;
      if(!connected[key] && isFilled(na,nb)){ connected[key]=true; stack.push([na,nb]); }
    }
  }
  let dropped=0;
  for(let i=0;i<grid.length;i++){ const row=grid[i]; if(!row) continue;
    for(let j=0;j<row.length;j++){
      if(isFilled(i,j) && !connected[i+","+j]){
        drops.push({x:centerX(i,j),y:centerY(i),vy:0,vx:(Math.random()-0.5)*2,color:grid[i][j],r:R});
        grid[i][j]=null; dropped++;
      }
    }
  }
  if(dropped){ addScore(dropped*20); dropSound(); }
}

function checkLose(){
  for(let i=0;i<grid.length;i++){ const row=grid[i]; if(!row) continue;
    for(let j=0;j<row.length;j++){
      if(row[j]!=null && centerY(i)+R>=deathLineY){ endGame(false); return; }
    }
  }
}

function addScore(v){ score+=v; scoreEl.textContent=score; post("gw:score",{score}); }

function spawnPop(x,y,color){
  popRings.push({x,y,r:R*0.3,max:R*1.6,a:1,color});
  const n=reduceMotion?4:9;
  for(let k=0;k<n;k++){ const a=Math.random()*6.28,sp=1+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:2+Math.random()*3,col:color}); }
}

// descent: when slide advances a full 2 rows, unshift 2 fresh rows
function advanceDescent(dt){
  if(state!=="play") return;
  slide += descentSpeed*(dt/16.7);
  while(slide >= 2*rowStep){
    slide -= 2*rowStep;
    const r1=newRow(1), r0=newRow(0);
    grid.unshift(r1); grid.unshift(r0);
  }
  checkLose();
}

// shooting
function fireBubble(){
  if(fly || state!=="play") return;
  const speed=Math.max(9, R*0.55);
  fly={ x:W/2, y:shooterY, vx:Math.cos(aimAngle)*speed, vy:Math.sin(aimAngle)*speed, r:R, color:current };
  current=next; next=pickShooterColor();
  shotsFired++;
  shootSound();
}

function updateFly(dt){
  if(!fly) return;
  const steps=4;
  for(let s=0;s<steps;s++){
    fly.x+=fly.vx/steps; fly.y+=fly.vy/steps;
    if(fly.x< boardX+R){ fly.x=boardX+R; fly.vx=Math.abs(fly.vx); }
    if(fly.x> boardX+boardW-R){ fly.x=boardX+boardW-R; fly.vx=-Math.abs(fly.vx); }
    if(fly.y<= centerY(0)-rowStep*0.1){
      // reached ceiling
      snapFly(); fly=null; return;
    }
    // collision with grid
    for(let i=0;i<grid.length;i++){ const row=grid[i]; if(!row) continue;
      const cy=centerY(i); if(Math.abs(cy-fly.y)>rowStep*1.6) continue;
      for(let j=0;j<row.length;j++){
        if(row[j]==null) continue;
        const cx=centerX(i,j), dx=cx-fly.x, dy=cy-fly.y;
        if(dx*dx+dy*dy < (R*1.85)*(R*1.85)){ snapFly(); fly=null; return; }
      }
    }
  }
}

// input
function setAimFromPoint(x,y){
  let dx=x-W/2, dy=y-shooterY;
  if(dy>-R) dy=-R; // always aim upward into the field
  let ang=Math.atan2(dy,dx); // in (-PI, 0)
  const maxA=-0.12, minA=-Math.PI+0.12; // clamp away from horizontal
  if(ang>maxA) ang=maxA;
  if(ang<minA) ang=minA;
  aimAngle=ang;
}
function pDown(x,y){ if(state!=="play"){ return; } aiming=true; setAimFromPoint(x,y); }
function pMove(x,y){ if(aiming) setAimFromPoint(x,y); }
function pUp(){ if(aiming && state==="play"){ fireBubble(); } aiming=false; }

canvas.addEventListener("touchstart",e=>{ const t=e.changedTouches[0]; pDown(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
canvas.addEventListener("touchmove",e=>{ const t=e.changedTouches[0]; pMove(t.clientX,t.clientY); e.preventDefault(); },{passive:false});
canvas.addEventListener("touchend",e=>{ pUp(); e.preventDefault(); },{passive:false});
canvas.addEventListener("mousedown",e=>{ pDown(e.clientX,e.clientY); });
canvas.addEventListener("mousemove",e=>{ pMove(e.clientX,e.clientY); });
window.addEventListener("mouseup",()=>pUp());
window.addEventListener("keydown",e=>{ if(e.key===" "&&state!=="play"){ startGame(); e.preventDefault(); } });

document.getElementById("playBtn").addEventListener("click",startGame);
document.getElementById("againBtn").addEventListener("click",startGame);

// draw
function drawBubble(x,y,ci,r){
  const col=PAL[ci];
  const g=ctx.createRadialGradient(x-r*0.35,y-r*0.38,r*0.1,x,y,r);
  g.addColorStop(0,lighter(col)); g.addColorStop(0.6,col); g.addColorStop(1,darker(col,0.6));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.ellipse(x-r*0.32,y-r*0.34,r*0.26,r*0.18,-0.6,0,7); ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.14)"; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x,y,r-0.6,0,7); ctx.stroke();
}
function drawAim(){
  if(state!=="play"||fly) return;
  // simulate path with bounces (dotted)
  let x=W/2,y=shooterY, vx=Math.cos(aimAngle), vy=Math.sin(aimAngle);
  const step=R*0.9; let dots=0;
  ctx.save();
  for(let s=0;s<120 && dots<42;s++){
    x+=vx*step; y+=vy*step;
    if(x<boardX+R){ x=boardX+R; vx=Math.abs(vx); }
    if(x>boardX+boardW-R){ x=boardX+boardW-R; vx=-Math.abs(vx); }
    if(y<centerY(0)) break;
    // stop if near a bubble
    let hit=false;
    for(let i=0;i<grid.length && !hit;i++){ const row=grid[i]; if(!row)continue; const cy=centerY(i);
      if(Math.abs(cy-y)>rowStep*1.5) continue;
      for(let j=0;j<row.length;j++){ if(row[j]==null)continue; const cx=centerX(i,j);
        if((cx-x)*(cx-x)+(cy-y)*(cy-y) < (R*1.8)*(R*1.8)){ hit=true; break; } } }
    if(s%2===0){ ctx.globalAlpha=Math.max(0.15,1-s/120); ctx.fillStyle="#fff";
      ctx.beginPath(); ctx.arc(x,y,2.2,0,7); ctx.fill(); dots++; }
    if(hit) break;
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function drawShooter(){
  // base
  ctx.fillStyle="rgba(11,26,50,.85)";
  ctx.beginPath(); ctx.arc(W/2,shooterY,R*1.5,0,7); ctx.fill();
  ctx.strokeStyle="rgba(140,160,255,.3)"; ctx.lineWidth=2; ctx.stroke();
  // barrel
  ctx.save(); ctx.translate(W/2,shooterY); ctx.rotate(aimAngle+Math.PI/2);
  ctx.fillStyle="rgba(140,160,255,.35)";
  ctx.fillRect(-R*0.35,-R*1.9,R*0.7,R*1.4);
  ctx.restore();
  if(!fly) drawBubble(W/2,shooterY,current,R);
  // next preview
  drawBubble(W/2 - R*3, shooterY, next, R*0.7);
  ctx.fillStyle="rgba(159,176,220,.7)"; ctx.font="700 "+Math.round(R*0.5)+"px "+"Nunito, sans-serif";
  ctx.textAlign="center"; ctx.fillText("NEXT", W/2 - R*3, shooterY+R*1.4);
}
function drawDeathLine(){
  ctx.save();
  ctx.setLineDash([8,8]);
  ctx.strokeStyle="rgba(255,77,125,"+(0.35+0.25*Math.sin(performance.now()*0.004))+")";
  ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(boardX,deathLineY); ctx.lineTo(boardX+boardW,deathLineY); ctx.stroke();
  ctx.restore();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=now-lastT; lastT=now; if(dt>60)dt=60;
  ctx.clearRect(0,0,W,H);

  let sx=0,sy=0;
  if(shake>0){ sx=(Math.random()*2-1)*shake; sy=(Math.random()*2-1)*shake; shake*=0.85; if(shake<0.4)shake=0; }
  ctx.save(); ctx.translate(sx,sy);

  if(state==="play" && !paused){
    advanceDescent(dt);
    updateFly(dt);
  }

  // board frame
  ctx.strokeStyle="rgba(140,160,255,.14)"; ctx.lineWidth=2;
  ctx.strokeRect(boardX-2, boardY-2, boardW+4, (deathLineY-boardY)+4);

  drawDeathLine();

  // grid bubbles
  for(let i=0;i<grid.length;i++){ const row=grid[i]; if(!row) continue; const cy=centerY(i);
    if(cy-R>H+40) continue; if(cy+R<-40) continue;
    for(let j=0;j<row.length;j++){ if(row[j]!=null) drawBubble(centerX(i,j),cy,row[j],R); } }

  drawAim();
  drawShooter();

  if(fly) drawBubble(fly.x,fly.y,fly.color,fly.r);

  // drops
  for(let i=drops.length-1;i>=0;i--){ const d=drops[i];
    if(!paused){ d.vy+=0.5; d.y+=d.vy; d.x+=d.vx; }
    if(d.y-d.r>H+30){ drops.splice(i,1); continue; }
    ctx.globalAlpha=0.9; drawBubble(d.x,d.y,d.color,d.r); ctx.globalAlpha=1;
  }
  // pop rings
  for(let i=popRings.length-1;i>=0;i--){ const p=popRings[i];
    p.r+=(p.max-p.r)*0.25; p.a-=dt*0.004; if(p.a<=0){ popRings.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.a); ctx.strokeStyle=p.color; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.stroke(); }
  ctx.globalAlpha=1;
  // particles
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.vx*=0.98; p.life-=dt*0.0024;
    if(p.life<=0){ particles.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;

  ctx.restore();
}
requestAnimationFrame(frame);

document.addEventListener("visibilitychange",()=>{ paused=document.hidden; if(!paused) lastT=performance.now(); });

post("gw:ready",{slug:SLUG});
})();
</script>
</body>
</html>
